name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }} / Clojure ${{ matrix.clojure }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
        clojure: ["1.11", "1.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: project.clj
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          lein: 2.11.2
      - name: Run tests
        run: |
          if [[ "${{ matrix.clojure }}" == "1.11" ]]; then
            lein with-profile +clojure-1.11 test
          else
            lein with-profile +clojure-1.12 test
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: project.clj
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          lein: 2.11.2
          clj-kondo: 2026.10.26
      - run: lein cljfmt check
      - run: lein check
      - run: clj-kondo --lint src test --fail-level error
      - run: lein jar
      - run: lein pom
      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@9fd1bcce27f67e3bd819a0a7620e332803dc43bc # v2.3.8
        with:
          scan-args: |-
            --no-ignore
            --no-resolve
            ./

  publish:
    needs: [test, quality]
    runs-on: ubuntu-latest
    environment: clojars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: project.clj
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          lein: 2.11.2
      - name: Verify tag and publish
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          version=$(sed -n 's/^(defproject [^ ]* "\([^"]*\)".*/\1/p' project.clj)
          test "v${version}" = "${GITHUB_REF_NAME}"
          lein deploy clojars

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Remove any existing draft release for this tag before creating the final release
          draft_id=$(gh api "repos/${REPO}/releases?per_page=20" \
            --jq ".[] | select(.draft == true and (.tag_name == \"${TAG}\" or (.name | startswith(\"Next Release\")))) | .id" | head -n 1)
          if [[ -n "${draft_id}" ]]; then
            gh api --method DELETE "repos/${REPO}/releases/${draft_id}"
          fi
          gh release create "${TAG}" --repo "${REPO}" --title "${TAG}" --generate-notes
